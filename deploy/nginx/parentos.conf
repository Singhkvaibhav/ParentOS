# Reverse proxy: TLS termination, static SPA, and API routing.
#
# One public entry point in front of both the built frontend and the API,
# so the browser sees a single origin. That is not just tidiness: it means
# the session cookie is same-origin, which is what makes SameSite=Lax
# actually protective rather than nominal.

upstream parentos_api {
    # Add more `server` lines to scale horizontally. Note that doing so
    # makes the in-memory rate-limit store per-instance (see the README
    # limitations) - wire rate-limit-redis before running more than one.
    server api:4000 max_fails=3 fail_timeout=15s;
    keepalive 32;
}

# Rate limiting at the edge, in front of the application's own limits.
# This one exists to absorb volumetric abuse before it costs Node any
# CPU at all; the app's limits are per-user and semantic.
limit_req_zone $binary_remote_addr zone=api_edge:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=api_conn:10m;

# Plain HTTP exists only to redirect. Serving anything real over it would
# leak the session cookie.
server {
    listen 80;
    server_name _;

    # ACME challenges must stay on HTTP or certificate renewal breaks.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # `listen ... http2` rather than the newer `http2 on;` directive:
    # the latter needs nginx >= 1.25.1, and Ubuntu 24.04 LTS - a very
    # common deploy target - ships 1.24. The old form is deprecated in
    # 1.25+ but still works there, so it's the one that runs everywhere.
    # (Caught by running `nginx -t` against this file rather than assuming.)
    listen 443 ssl http2;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/parentos/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/parentos/privkey.pem;

    # TLS 1.2 is kept for older Android devices, which are common among
    # the second-hand phone market this app's users plausibly have.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    # HSTS. Deliberately without `preload`: preloading is effectively
    # irreversible, and committing to it before the domain is settled is
    # a decision that's very hard to undo.
    #
    # IMPORTANT: nginx's add_header does NOT accumulate. A location block
    # containing any add_header of its own DISCARDS every add_header
    # inherited from here. Both location blocks below set Cache-Control,
    # so without repeating this line inside them, HSTS would be silently
    # absent from every response - present in the config, missing on the
    # wire. Caught by curling the running proxy rather than reading it.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # The application sets its own CSP and other headers via Helmet;
    # duplicating them here risks the two drifting apart.

    client_max_body_size 12m;   # matches the direct-upload limit
    server_tokens off;          # don't advertise the nginx version

    # --- API -------------------------------------------------------------
    location /api/ {
        limit_req zone=api_edge burst=60 nodelay;
        limit_conn api_conn 20;

        proxy_pass http://parentos_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Pass a request id through so a trace started at the edge matches
        # the one in the application logs, rather than being two unrelated
        # ids for the same request.
        proxy_set_header X-Request-Id $request_id;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Stripe webhooks: not browser traffic, so the per-IP rate limit above
    # would be counting Stripe's egress addresses rather than any user.
    # Throttling those risks dropping payment confirmations.
    location = /api/transactions/webhook {
        proxy_pass http://parentos_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Stripe signs the RAW body; nginx must not alter it.
        proxy_request_buffering off;
    }

    # Metrics are operational, not public.
    # No /metrics here by design. Metrics moved to a separate listener on
    # the API container (port 9091), reachable only on the internal compose
    # network - so this proxy is not the boundary protecting them. Adding a
    # location block back would re-expose operational data through the
    # public server, which is what the move was for.

    # --- SEO shell (seo/routes.js) -----------------------------------------
    # A listing's own URL, plus the sitemap and robots.txt that reference
    # it, must be reachable at the site root for crawlers and link-preview
    # bots to find them at all - so these three exceptions are carved out
    # of the SPA fallback below and sent to the API instead, which returns
    # the same built index.html with real per-page <title>/Open Graph tags
    # injected (see seo/render.js). A real browser gets the identical
    # response and the SPA boots exactly as it would have from the static
    # file - this only changes what a non-JS client sees.
    location ~ ^/listing/[^/]+$ {
        limit_req zone=api_edge burst=60 nodelay;
        proxy_pass http://parentos_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /sitemap.xml {
        proxy_pass http://parentos_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location = /robots.txt {
        proxy_pass http://parentos_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # --- Locally-stored uploads -------------------------------------------
    # Only used when S3 isn't configured. With object storage these are
    # served by the CDN and never reach nginx.
    location /uploads/ {
        proxy_pass http://parentos_api;
        proxy_cache_valid 200 7d;
        expires 7d;
    }

    # --- Static SPA -------------------------------------------------------
    root /usr/share/nginx/html;
    index index.html;

    # Hashed asset filenames change whenever content changes, so they can
    # be cached indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always; # re-declared: see note above
        try_files $uri =404;
    }

    # index.html must NOT be cached, or a deploy leaves browsers loading an
    # old page that references asset hashes which no longer exist.
    location / {
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always; # re-declared: see note above
        try_files $uri $uri/ /index.html;
    }
}
