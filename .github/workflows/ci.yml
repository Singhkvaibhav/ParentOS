name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        # postgis image, not plain postgres: the distance search has a
        # spatial path and a bounding-box fallback, and plain postgres:16
        # would silently exercise only the fallback - so CI would pass
        # while never testing the path production actually runs.
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: parentos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run migrate
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/parentos_test
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/parentos_test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  # Builds the images for real. They were written but never built, which
  # meant "the Dockerfiles exist" was being mistaken for "the Dockerfiles
  # work" - a distinction that only shows up during a deploy, which is the
  # worst time to find out. No registry push: this is a build check.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          load: true
          tags: parentos-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build worker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.worker
          push: false
          load: true
          tags: parentos-worker:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          load: true
          tags: parentos-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A built image that won't start is still broken. This catches a bad
      # CMD, a missing runtime dependency, or a wrong working directory -
      # none of which a successful build would reveal.
      - name: API image starts and reports its config problems
        run: |
          # No env supplied, so the production config check should refuse
          # to start AND say why. A silent crash or a clean start would
          # both indicate the startup validation isn't wired into the image.
          output=$(docker run --rm -e NODE_ENV=production parentos-api:ci 2>&1 || true)
          echo "$output"
          echo "$output" | grep -qi "JWT_SECRET\|DATABASE_URL\|CORS_ORIGINS" \
            || (echo "::error::API image did not report missing configuration on startup" && exit 1)

      - name: Compose file is valid
        run: docker compose -f docker-compose.yml config --quiet
