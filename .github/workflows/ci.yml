name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        # postgis image, not plain postgres: the distance search has a
        # spatial path and a bounding-box fallback, and plain postgres:16
        # would silently exercise only the fallback - so CI would pass
        # while never testing the path production actually runs.
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: parentos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run migrate
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/parentos_test
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/parentos_test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  # Builds the images for real. They were written but never built, which
  # meant "the Dockerfiles exist" was being mistaken for "the Dockerfiles
  # work" - a distinction that only shows up during a deploy, which is the
  # worst time to find out. No registry push: this is a build check.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Create Compose environment
        run: |
          printf '%s\n' 'POSTGRES_PASSWORD=ci-postgres-password' > .env

      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          load: true
          tags: parentos-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build worker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.worker
          push: false
          load: true
          tags: parentos-worker:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          load: true
          tags: parentos-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A built image that won't start is still broken. This catches a bad
      # CMD, a missing runtime dependency, or a wrong working directory -
      # none of which a successful build would reveal.
      - name: API image starts and reports its config problems
        run: |
          # No env supplied, so the production config check should refuse
          # to start AND say why. A silent crash or a clean start would
          # both indicate the startup validation isn't wired into the image.
          output=$(docker run --rm -e NODE_ENV=production parentos-api:ci 2>&1 || true)
          echo "$output"
          echo "$output" | grep -qi "JWT_SECRET\|DATABASE_URL\|CORS_ORIGINS" \
            || (echo "::error::API image did not report missing configuration on startup" && exit 1)

      - name: Create CI production environment
        run: |
          printf '%s\n' \
            'JWT_SECRET=ci-jwt-secret-that-is-long-enough-for-validation-000000' \
            'CORS_ORIGINS=https://ci.example' \
            'FRONTEND_URL=https://ci.example' \
            'STRIPE_SECRET_KEY=sk_test_ci' \
            'STRIPE_WEBHOOK_SECRET=whsec_ci' \
            'SMTP_HOST=smtp.example' \
            'S3_BUCKET=ci-bucket' \
            'S3_REGION=eu-north-1' \
            'S3_ACCESS_KEY_ID=ci-access-key' \
            'S3_SECRET_ACCESS_KEY=ci-secret-key' > .env.production

      - name: Compose file is valid
        run: docker compose -f docker-compose.yml config --quiet

  # Brings the real stack up and runs migrations against it. Building an
  # image proves it compiles; it does not prove the containers can find each
  # other, that the entrypoint works, or that migrations run inside the
  # image rather than only on a developer's machine. Those are exactly the
  # things that fail at deploy time.
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Two files, because they serve different purposes and mixing them up
      # produces a container that starts with no configuration:
      #   .env             - compose's own ${VAR} interpolation
      #   .env.production  - the api service's env_file, i.e. what the
      #                      process inside the container actually reads
      - name: Create environment files for the stack
        run: |
          printf '%s\n' 'POSTGRES_PASSWORD=ci-postgres-password' > .env
          printf '%s\n' \
            'JWT_SECRET=ci-jwt-secret-that-is-long-enough-for-validation-000000' \
            'CORS_ORIGINS=https://ci.example' \
            'FRONTEND_URL=https://ci.example' \
            'STRIPE_SECRET_KEY=sk_test_ci' \
            'STRIPE_WEBHOOK_SECRET=whsec_ci' \
            'SMTP_HOST=smtp.example' \
            'S3_BUCKET=ci-bucket' \
            'S3_REGION=eu-north-1' \
            'S3_ACCESS_KEY_ID=ci-access-key' \
            'S3_SECRET_ACCESS_KEY=ci-secret-key' > .env.production

      # Only the data services and the API. nginx/certbot want real
      # certificates and a real domain, which CI has neither of - pretending
      # otherwise would test a fiction.
      - name: Start Postgres, Redis and the API
        run: docker compose up -d --build postgres redis api

      - name: Wait for the API to become healthy
        run: |
          for i in $(seq 1 60); do
            if docker compose exec -T api node -e "require('http').get('http://localhost:4000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"; then
              echo "API is up"; exit 0
            fi
            sleep 5
          done
          echo "::error::API never became healthy"
          docker compose ps
          docker compose logs --no-color api postgres redis
          exit 1

      - name: Run migrations inside the container
        run: docker compose exec -T api npm run migrate

      - name: Migrations are idempotent on a second run
        run: docker compose exec -T api npm run migrate

      - name: Smoke test through the running stack
        run: |
          docker compose exec -T api node -e "
            const http = require('http');
            const check = (path, expected) => new Promise((resolve, reject) => {
              http.get('http://localhost:4000' + path, (r) => {
                if (r.statusCode === expected) return resolve();
                reject(new Error(path + ' expected ' + expected + ', got ' + r.statusCode));
              }).on('error', reject);
            });
            (async () => {
              await check('/api/health', 200);
              await check('/api/listings', 200);
              await check('/api/meta/config', 200);
              await check('/api/transactions/mine', 401);
              console.log('stack smoke test passed');
            })().catch((e) => { console.error(e.message); process.exit(1); });
          "

      # The launch gate: not just "the containers start" but "a real user
      # journey survives them". Runs inside the API container against the
      # composed Postgres and Redis, so it exercises the deployed artefact
      # rather than a developer machine.
      #
      # Stripe-dependent steps stop at checkout: CI has no Stripe keys, and
      # the journey script exits with a distinct code saying so rather than
      # reporting a failure it cannot distinguish from a real one.
      - name: End-to-end journey through the composed stack
        run: |
          set +e
          docker compose exec -T api npm run journey
          code=$?
          set -e
          # 0 = full pass, 2 = stopped at the Stripe step for want of keys.
          if [ "$code" -eq 0 ] || [ "$code" -eq 2 ]; then
            echo "journey completed (exit $code)"
          else
            echo "::error::journey failed with exit $code"
            exit 1
          fi

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
