# Production stack.
#
#                        internet
#                           |
#                      [  proxy  ]  nginx: TLS, static SPA, API routing
#                           |
#              +------------+------------+
#              v            v            v
#             api         worker    (static assets, served by proxy)
#              |            |
#      +-------+-----+------+
#      v             v
#   postgres       redis        object storage (external: S3/R2)
#      |
#      +-- backup (scheduled, verified pg_dump)
#
# Only the proxy publishes ports. Postgres and Redis are not reachable from
# the host at all - an exposed database port is one of the most common ways
# a small deployment gets compromised.
#
# NOTE: this file has NOT been built or run where it was written (no Docker
# daemon available). The pieces it depends on - the nginx config, the
# backup script, the health/readiness endpoints, the startup config
# validation - have all been executed and verified. The orchestration
# itself has not. Treat the first `docker compose up` as a real test.

name: parentos

services:
  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/parentos.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
      - certbot-certs:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot:ro
    depends_on:
      - api

  # TLS certificates, renewed on a loop rather than host cron so the stack
  # stays self-contained. Writes into a volume the proxy reads.
  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - certbot-certs:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    entrypoint: sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://parentos:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/parentos
      REDIS_URL: redis://redis:6379
      # 0.0.0.0 inside the container so other containers on the compose
      # network can scrape it. The container's network namespace is the
      # boundary; the port is never published to the host.
      METRICS_HOST: 0.0.0.0
      # Points seo/render.js at the mount below. The module's own default
      # (../../frontend/dist relative to the backend source) only resolves
      # correctly on a local checkout where both repos sit side by side -
      # inside this container the backend lives at /app with no sibling
      # frontend directory at all, so without this it would silently fall
      # back to the no-SPA-takeover shell on every request.
      FRONTEND_DIST_DIR: /app/frontend-dist
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # No `ports` - only the proxy reaches the API.
    expose:
      - "4000"
      # Internal only. `expose` publishes nothing to the host - a scraper on
      # the compose network can reach it, the internet cannot. Moving this
      # to `ports:` would undo the whole point of separating metrics from
      # the public app.
      - "9091"
    volumes:
      # Only used when S3 isn't configured. A named volume means images
      # survive a redeploy, though not a move to another host - which is
      # why object storage is the real answer (the app warns about this at
      # startup when S3_BUCKET is unset).
      - api-uploads:/app/uploads
      # Same build the proxy serves (see the proxy service above), mounted
      # read-only here too: seo/render.js reads its index.html to inject
      # per-listing meta tags, so a crawler/link-preview bot hitting
      # /listing/:id gets the real page title and Open Graph tags instead
      # of the one static shell every route otherwise shares. Reusing the
      # actual built file (rather than reconstructing the shell here) means
      # this never drifts out of sync with the frontend's real script/link
      # tags, which change hash on every build.
      - ./frontend/dist:/app/frontend-dist:ro

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://parentos:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/parentos
      REDIS_URL: redis://redis:6379
      # 0.0.0.0 inside the container so other containers on the compose
      # network can scrape it. The container's network namespace is the
      # boundary; the port is never published to the host.
      METRICS_HOST: 0.0.0.0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # The worker strips EXIF from quarantined uploads, so it needs the
      # same storage the API wrote them to.
      - api-uploads:/app/uploads

  postgres:
    # postgis rather than plain postgres: migration 008 enables the
    # extension. It degrades gracefully without it, but distance search
    # falls back to the slower in-process path.
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: parentos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: parentos
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parentos -d parentos"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Persistence on: the queue holds jobs representing real user actions
    # (an AI reply someone is waiting for, an image awaiting EXIF
    # stripping). Losing them on restart is the exact failure the queue was
    # introduced to fix.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://parentos:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/parentos
      BACKUP_DIR: /backups
      # Offsite copy - see scripts/backup.sh and .env.production.example.
      # All empty/unset by default: offsite storage is opt-in, not assumed.
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-}
      BACKUP_S3_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      BACKUP_S3_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
    volumes:
      - ./scripts/backup.sh:/usr/local/bin/backup.sh:ro
      - backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    # The script verifies every dump and exits non-zero on failure, so a
    # bad backup is visible in container logs instead of failing silently.
    # aws-cli is only needed for the offsite-copy step above - installed
    # unconditionally rather than made conditional on BACKUP_S3_BUCKET,
    # since that's set via docker-compose env (not known at image-build
    # time) and the install itself is cheap relative to a daily backup run.
    entrypoint: sh -c 'apk add --no-cache bash aws-cli >/dev/null; while :; do bash /usr/local/bin/backup.sh || echo "BACKUP FAILED"; sleep 86400; done'

volumes:
  postgres-data:
  redis-data:
  api-uploads:
  backups:
  certbot-certs:
  certbot-webroot:
